name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The client targets 3.9 -- what macOS ships with the Xcode command line
        # tools -- but the import guard above needs sys.stdlib_module_names,
        # which arrived in 3.10. compile-on-3.9 below covers the floor instead.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The client runs on engineers' machines with no install step, so cli/
      # must import nothing outside the standard library. The central pipeline
      # is allowed optional extras -- openpyxl for writing workbooks, requests
      # and google-cloud for the transports -- because it runs here, and each
      # of those already degrades to a stdlib path or exits with instructions.
      # This guards the constraint that actually binds.
      - name: The client imports nothing outside the standard library
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          # Sibling modules, discovered rather than listed. A hardcoded list
          # silently rots into a red build every time a module is added -- which
          # is what happened, and why this check went unread for a while. The
          # question it is asking is "does cli/ reach outside the standard
          # library", and a module sitting in cli/ is never that.
          local = {p.stem for p in pathlib.Path("cli").rglob("*.py")}
          local |= {p.stem for p in pathlib.Path("pollers").rglob("*.py")}
          local |= {p.stem for p in pathlib.Path("collector").rglob("*.py")}
          # The shared library is a package, so its stem is `__init__`, not
          # `common`. Named explicitly: without it this guard reports the one
          # import every module in cli/ makes as a third-party dependency.
          local |= {p.parent.name
                    for p in pathlib.Path(".").glob("*/__init__.py")}
          bad = []
          for path in sorted(pathlib.Path("cli").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  bad += [f"{path}: {n}" for n in names
                          if n not in stdlib and n not in local]
          if bad:
              print("\n".join(sorted(set(bad))))
              raise SystemExit("cli/ must stay standard library only")
          print(f"cli/ is standard library only: confirmed ({len(local)} local modules)")
          PY

      # The endpoint is allowed exactly one wheel, and only on the s3:// path.
      # Anything else creeping in turns a service that runs anywhere into one
      # that needs a dependency resolver on the box it is deployed to.
      - name: The server depends on nothing but boto3
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          allowed = {"boto3", "botocore"}
          local = {p.stem for p in pathlib.Path("server").rglob("*.py")}
          local |= {p.stem for p in pathlib.Path("cli").rglob("*.py")}
          bad = []
          for path in sorted(pathlib.Path("server").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  bad += [f"{path}: {n}" for n in names
                          if n not in stdlib | allowed | local]
          if bad:
              print("\n".join(sorted(set(bad))))
              raise SystemExit("server/ may depend on boto3 and nothing else")
          print("server/ depends on boto3 and nothing else: confirmed")
          PY

      - name: Optional extras for the central pipeline
        # openpyxl writes the workbooks; boto3 is the endpoint's S3 backend.
        # Both degrade to a stdlib path when absent, which is why the suite is
        # meaningful either way -- but the S3 tests only run when botocore is
        # importable, and skipped tests prove nothing.
        run: python3 -m pip install --quiet openpyxl boto3

      # Suites run one at a time. Every tests/ directory would otherwise be
      # the same package name, and the second one to load shadows the first.
      - name: The client parses on the 3.9 floor
        run: |
          python3 - <<'PY'
          # macOS ships 3.9 with the Xcode command line tools and the client has
          # to run on that untouched. Syntax is the part that breaks silently.
          import pathlib, subprocess, sys
          files = [str(p) for p in sorted(pathlib.Path("cli").rglob("*.py"))]
          out = subprocess.run([sys.executable, "-c",
              "import ast,sys;[ast.parse(open(f).read(), f, feature_version=(3,9)) for f in sys.argv[1:]]",
              *files], capture_output=True, text=True)
          print(out.stdout or "cli/ parses under 3.9 syntax")
          if out.returncode:
              print(out.stderr)
              raise SystemExit(1)
          PY

      # The S3 backend cannot be reached by the end-to-end suite, so its tests
      # skip themselves when botocore is missing. A skip that nobody notices is
      # the production path going untested, which is how it shipped once.
      - name: The S3 backend is actually exercised, not skipped
        run: |
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "unittest", "-v",
               "server.tests.test_store"],
              capture_output=True, text=True)
          text = out.stdout + out.stderr
          if "skipped" in text.lower():
              print(text)
              raise SystemExit("S3 tests skipped -- botocore is not installed")
          print("S3 backend tests ran")
          PY

      - name: Tests
        run: |
          set -e
          for suite in pollers report collector cli importers server; do
            echo "--- $suite"
            python3 -m unittest discover -s "$suite/tests"
          done

      # The client ships as one file, so the packaged form is the form that
      # runs on fourteen laptops -- and three of the ways it can break are
      # invisible to every test above, because they are all about a `.pyz`
      # rather than a checkout. Built and exercised on every push, not only at
      # a tag, so the release job is never the first thing to find out.
      - name: The client builds as a zipapp, and the zipapp runs
        run: |
          set -eu
          python3 tools/build_pyz.py --out /tmp/insight-a.pyz
          python3 tools/build_pyz.py --out /tmp/insight-b.pyz
          # Reproducible. The digest published in install.sh is what every
          # laptop verifies against; a digest that moves when nothing moved is
          # a number to trust rather than a number to check.
          a="$(sha256sum /tmp/insight-a.pyz | cut -d' ' -f1)"
          b="$(sha256sum /tmp/insight-b.pyz | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "two builds differ: $a $b"; exit 1; }

          python3 /tmp/insight-a.pyz --version

          # The archive must not carry the test suite, and must not carry the
          # central pipeline. An engineer's laptop has no business with either.
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile("/tmp/insight-a.pyz").namelist()
          bad = [n for n in names
                 if n.startswith(("importers/", "report/", "sql/", "server/"))
                 or "/tests/" in n or n.endswith(".pyc")]
          assert not bad, bad
          print("archive holds %d files, none of them shipped by accident" % len(names))
          PY

          home="$(mktemp -d)"
          repo="$(mktemp -d)"
          git init -q "$repo"
          export SETA_INSIGHT_HOME="$home"
          python3 /tmp/insight-a.pyz init --yes >/dev/null
          # The only genuinely zip-specific code in the client: the commit hook
          # is a data file inside the archive, reached through zipimport's
          # get_data rather than open(). A regression is silent everywhere else.
          python3 /tmp/insight-a.pyz install-hook --repo "$repo"
          diff "$repo/.git/hooks/prepare-commit-msg" cli/hooks/prepare-commit-msg
          echo "zipapp: reproducible, runs, and the bundled hook survives it"

      - name: The installer template is valid POSIX sh
        run: |
          set -eu
          # Rendered with throwaway values -- this checks the template's shape,
          # not a release. The release job checks the rendered article.
          sed -e 's|@VERSION@|0.0.0|' -e "s|@SHA256@|$(printf '0%.0s' $(seq 64))|" \
              -e 's|@URL@|https://example.com/x.pyz|' \
              -e 's|@ENDPOINT@|https://example.com|' -e 's|@SCHEMA@|1.1.0|' \
              server/install.sh.in > /tmp/install.sh
          sh -n /tmp/install.sh
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          shellcheck -s sh -S warning /tmp/install.sh
          # And that the endpoint can still read its manifest out of it -- the
          # two are coupled by four lines, and this is where that is checked.
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path[:0] = ["server", "cli"]
          import proxy
          print(json.loads(proxy.install_manifest(
              pathlib.Path("/tmp/install.sh").read_bytes())))
          PY
